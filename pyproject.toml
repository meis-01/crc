[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "codeii-reconstruction-data"
version = "0.1.0"
description = "Leakage-safe preparation of CODE-II ECGs for lead reconstruction"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.11",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
wfdb = ["wfdb>=4.2"]
test = ["pytest>=8.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

