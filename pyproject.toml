[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-esn"
version = "0.1.0"
description = "Four-mode Wilson-Cowan reservoir ensemble for EEG experiments"
requires-python = ">=3.10"
dependencies = [
  "mne>=1.8",
  "numpy>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
